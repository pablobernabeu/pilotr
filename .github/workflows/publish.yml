# Build and publish the Python package to PyPI through trusted publishing
# (OIDC), so no API token is ever stored in the repository.
#
# The pilotr project on PyPI must list this repository as a trusted publisher
# (workflow file "publish.yml", environment "pypi"). The workflow runs when a
# GitHub release is published, and can also be run by hand. The publish step's
# skip-existing leaves a version already on PyPI untouched.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only at the workflow level: the build job only checks out and builds, and
# without this line it would inherit whatever the repository default happens to
# be. The publish job re-declares the one elevation it needs, the OIDC id-token,
# at the job level, and a job-level block replaces this one entirely rather than
# adding to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the distribution
        working-directory: python
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pilotr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
