# Build and publish the project website. The site is a hub: a landing page at the
# Pages root (https://pablobernabeu.github.io/pilotr/) pointing at the pkgdown
# documentation under /r/, the mkdocs documentation under /python/ and the
# serverless no-code app under /app/. Everything is staged into site/ and deployed
# together to the gh-pages branch on every relevant push to main and on 'Run
# workflow' from main. A pull request builds the site without deploying it, so
# that a change that breaks the build shows before the merge. The gh-pages push
# uses the built-in GITHUB_TOKEN.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'r/pilotr/**'
      - 'python/**'
      - 'app-lite/**'
      - 'spec/**'
      - 'README.md'
      - '.github/workflows/site.yml'
      # The landing page is the root of the published site, so an edit to it alone
      # changes what visitors see and has to trigger a rebuild. The not-found page
      # is staged beside it and earns its place here for the same reason.
      - '.github/landing.html'
      - '.github/404.html'
  pull_request:
    paths:
      - 'r/pilotr/**'
      - 'python/**'
      - 'app-lite/**'
      - 'spec/**'
      - 'README.md'
      - '.github/workflows/site.yml'
      - '.github/landing.html'
      - '.github/404.html'
  workflow_dispatch:

# The build only reads the repository. The deploy job, the one write, declares
# its own permission to push to gh-pages.
permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight gh-pages push

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          dependencies: '"all"'
          # roxygen2 is pinned to the release that DESCRIPTION records and that the
          # namespace job of R-CMD-check.yaml checks man/ with, so that the help
          # pages on the site are the committed ones.
          extra-packages: |
            any::pkgdown
            cran::roxygen2@8.0.0
            any::shinylive
            local::.

      - name: Generate Rd help files from roxygen comments
        shell: Rscript {0}
        # Rd only. NAMESPACE is generated by roxygen2 and committed, and a docs build
        # leaves committed source files as they are. devtools::document() regenerates
        # NAMESPACE with whatever change altered an @export tag.
        run: roxygen2::roxygenise("r/pilotr", roclets = "rd")

      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site(pkg = "r/pilotr", install = FALSE, new_process = FALSE)

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the
        # full text built from LICENSE.md. Keep only the full-text page live,
        # and drop the markdown copy pkgdown leaves beside the stub.
        #
        # The sitemap entry has to go with the page. pkgdown writes sitemap.xml
        # before this step runs, so deleting the page alone would leave a <loc>
        # for a URL that answers 404, and search engines read the sitemap and
        # would follow it. pkgdown writes one <url> per line, so a line filter
        # removes exactly that entry.
        run: |
          rm -f r/pilotr/docs/LICENSE-text.html r/pilotr/docs/LICENSE-text.md
          if [ -f r/pilotr/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' r/pilotr/docs/sitemap.xml > r/pilotr/docs/sitemap.new || true
            if [ -s r/pilotr/docs/sitemap.new ]; then
              mv r/pilotr/docs/sitemap.new r/pilotr/docs/sitemap.xml
            else
              rm -f r/pilotr/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r r/pilotr/docs site/r

      - name: Build the no-code app into site/app
        shell: Rscript {0}
        run: |
          stage <- "app-stage"
          dir.create(stage, showWarnings = FALSE)
          # app-lite/engine-files.txt is the single place the browser build's engine
          # subset is named; app.R loads whatever ends up staged beside it. A second list
          # here could drift from it and ship the app without validate.R, which every
          # Simulate click needs.
          engine <- readLines("app-lite/engine-files.txt")
          engine <- trimws(sub("#.*$", "", engine))
          engine <- engine[nzchar(engine)]
          stopifnot(all(file.exists(file.path("r/pilotr/R", engine))))
          file.copy(file.path("r/pilotr/R", engine), stage, overwrite = TRUE)
          file.copy("app-lite/app.R", stage, overwrite = TRUE)
          # Without template_params the page is titled "Shiny App" and has no icon.
          # app-lite/build_shinylive.R passes the same values, and the icons it links are
          # the R site's, copied beside the page.
          icons <- paste(
            '<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">',
            '<link rel="icon" type="image/svg+xml" href="favicon.svg">', sep = "\n")
          shinylive::export(stage, "site/app",
                            template_params = list(title = "pilotr: no-code app",
                                                   include_in_head = icons))
          stopifnot(all(file.copy(
            file.path("r/pilotr/pkgdown/favicon", c("favicon-96x96.png", "favicon.svg")),
            "site/app", overwrite = TRUE)))

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # markdown-exec 1.12.3 is the first release that knows the guides'
      # source="block", which replaced source="material-block".
      - name: Build mkdocs into site/python
        run: |
          set -e
          python -m pip install --quiet mkdocs-material "mkdocstrings[python]" \
            "markdown-exec>=1.12.3" matplotlib scipy statsmodels pandas
          cd python && python -m mkdocs build --strict --site-dir ../site/python

      - name: Write landing page
        # The not-found page is staged alongside. GitHub Pages serves the root
        # 404.html for every URL that matches no file, so without this file a
        # miss anywhere on the site fell through to GitHub's generic 404, which
        # offers a visitor no way back in.
        run: |
          cp r/pilotr/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      - name: Leave redirect stubs at the pre-hub URLs
        # Until the site became a hub, the pkgdown pages were served from the root
        # of the Pages site and the mkdocs pages from /py/. Every link, bookmark
        # and search result recorded before that change points at a path that no
        # longer holds a page. This walks the two staged trees and leaves a
        # meta-refresh stub at each old path, pointing at the same document under
        # its new prefix, so none of those references dead-ends. The rel=canonical
        # tells a search engine which copy is the real one, so the ranking moves
        # across rather than being split between two URLs.
        #
        # The step exists only for continuity and can be deleted once the old URLs
        # have aged out of the search indexes and out of people's bookmarks.
        run: |
          set -e
          SITE="https://pablobernabeu.github.io/pilotr"

          write_stub () {
            stub_path="$1"
            target="$2"
            mkdir -p "$(dirname "$stub_path")"
            {
              printf '<!doctype html>\n<html lang="en">\n<head>\n'
              printf '<meta charset="utf-8">\n'
              printf '<meta http-equiv="refresh" content="0; url=%s">\n' "$target"
              printf '<link rel="canonical" href="%s">\n' "$target"
              printf '<title>This page has moved</title>\n'
              printf '</head>\n<body>\n'
              printf '<p>This page has moved to <a href="%s">%s</a>.</p>\n' "$target" "$target"
              printf '</body>\n</html>\n'
            } > "$stub_path"
          }

          # The pkgdown pages: what was /pilotr/<path> is now /pilotr/r/<path>.
          find site/r -name '*.html' | while read -r page; do
            rel="${page#site/r/}"
            case "$rel" in
              # The root of the site belongs to the landing page and the three staged
              # trees own their own prefixes, so a stub written at any of those paths
              # would overwrite a page that is live in the new layout. py/ is left to
              # the mkdocs stubs written below.
              index.html|r/*|python/*|app/*|py/*) continue ;;
              # A stub here would take every mistyped URL anywhere on the site,
              # including under /python/ and /app/, to the R site's not-found page.
              # The root 404.html is now the hub's own not-found page, staged from
              # .github/404.html by the landing-page step above, so this skip also
              # protects that file from being overwritten.
              404.html) continue ;;
            esac
            write_stub "site/$rel" "$SITE/r/$rel"
          done

          # The mkdocs pages: what was /pilotr/py/<path> is now /pilotr/python/<path>.
          # mkdocs publishes directory URLs, so the target drops a trailing
          # index.html and reads as the canonical the real page declares for
          # itself, rather than as a second spelling of it. Nothing can be
          # overwritten here, because site/py holds nothing but these stubs.
          find site/python -name '*.html' | while read -r page; do
            rel="${page#site/python/}"
            write_stub "site/py/$rel" "$SITE/python/${rel%index.html}"
          done

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The only write in the workflow: the push of the site to gh-pages.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          touch site/.nojekyll
          PUB="$(mktemp -d)"
          cp -r site/. "$PUB"/
          cd "$PUB"
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="pilotr-site[bot]" -c user.email="deploy@users.noreply.github.com" \
              commit -q -m "Deploy site (landing page, pkgdown, mkdocs and app)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  sidebar-doi:
    name: The R site's sidebar shows the DOI once, as a link
    # pkgdown copies the README's DOI badge into Dev status, where
    # pkgdown/extra.scss hides it, and the Citation component gives the DOI as a
    # link. This fails if pkgdown's markup or the compiled stylesheet stops
    # matching those rules, which would bring the duplicate back. It runs beside
    # the deploy job, so that a failure marks the run red without holding the
    # site back.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Check the DOI in the sidebar
        run: python3 .github/check_doi_display.py --site site/r --package r/pilotr
