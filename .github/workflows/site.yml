# Build and publish the project website. The site is a hub: a landing page at the
# Pages root (https://pablobernabeu.github.io/pilotr/) pointing at the pkgdown
# documentation under /r/, the mkdocs documentation under /python/ and the
# serverless no-code app under /app/. Everything is staged into site/ and deployed
# together to the gh-pages branch on every relevant push to main (and on demand).
# Free, native GitHub Actions; the gh-pages push uses the built-in GITHUB_TOKEN.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'r/pilotr/**'
      - 'python/**'
      - 'app-lite/**'
      - 'spec/**'
      - 'README.md'
      - '.github/workflows/site.yml'
      # The landing page is the root of the published site, so an edit to it alone
      # changes what visitors see and has to trigger a rebuild. The not-found page
      # is staged beside it and earns its place here for the same reason.
      - '.github/landing.html'
      - '.github/404.html'
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages via GITHUB_TOKEN

concurrency:
  group: site
  cancel-in-progress: false   # never interrupt an in-flight gh-pages push

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/pilotr
          dependencies: '"all"'
          extra-packages: |
            any::pkgdown
            any::roxygen2
            any::shinylive
            local::.

      - name: Generate Rd help files from roxygen comments
        shell: Rscript {0}
        run: roxygen2::roxygenise("r/pilotr", roclets = "rd")   # Rd only; keep committed NAMESPACE

      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site(pkg = "r/pilotr", install = FALSE, new_process = FALSE)

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the
        # full text built from LICENSE.md. Keep only the full-text page live,
        # and drop the markdown copy pkgdown leaves beside the stub.
        #
        # The sitemap entry has to go with the page. pkgdown writes sitemap.xml
        # before this step runs, so deleting the page alone left a <loc>
        # advertising a URL that 404s -- and a sitemap is read by search engines,
        # which is the one audience that would then follow it. pkgdown emits one
        # <url> per line, so a line filter removes exactly that entry.
        run: |
          rm -f r/pilotr/docs/LICENSE-text.html r/pilotr/docs/LICENSE-text.md
          if [ -f r/pilotr/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' r/pilotr/docs/sitemap.xml > r/pilotr/docs/sitemap.new || true
            if [ -s r/pilotr/docs/sitemap.new ]; then
              mv r/pilotr/docs/sitemap.new r/pilotr/docs/sitemap.xml
            else
              rm -f r/pilotr/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r r/pilotr/docs site/r

      - name: Build the no-code app into site/app
        shell: Rscript {0}
        run: |
          stage <- "app-stage"
          dir.create(stage, showWarnings = FALSE)
          file.copy(file.path("r/pilotr/R", c("core.R", "simulate.R", "parallel.R", "power.R", "validate.R", "spec_builder.R")),
                    stage, overwrite = TRUE)
          file.copy("app-lite/app.R", stage, overwrite = TRUE)
          shinylive::export(stage, "site/app")

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build mkdocs into site/python
        run: |
          set -e
          python -m pip install --quiet mkdocs-material "mkdocstrings[python]" \
            markdown-exec matplotlib scipy statsmodels pandas
          cd python && python -m mkdocs build --strict --site-dir ../site/python

      - name: Write landing page
        # The not-found page is staged alongside. GitHub Pages serves the root
        # 404.html for every URL that matches no file, so without this file a
        # miss anywhere on the site fell through to GitHub's generic 404, which
        # offers a visitor no way back in.
        run: |
          cp r/pilotr/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      - name: Leave redirect stubs at the pre-hub URLs
        # Until the site became a hub, the pkgdown pages were served from the root
        # of the Pages site and the mkdocs pages from /py/. Every link, bookmark
        # and search result recorded before that change points at a path that no
        # longer holds a page. This walks the two staged trees and leaves a
        # meta-refresh stub at each old path, pointing at the same document under
        # its new prefix, so none of those references dead-ends. The rel=canonical
        # tells a search engine which copy is the real one, so the ranking moves
        # across rather than being split between two URLs.
        #
        # The step exists only for continuity and can be deleted once the old URLs
        # have aged out of the search indexes and out of people's bookmarks.
        run: |
          set -e
          SITE="https://pablobernabeu.github.io/pilotr"

          write_stub () {
            stub_path="$1"
            target="$2"
            mkdir -p "$(dirname "$stub_path")"
            {
              printf '<!doctype html>\n<html lang="en">\n<head>\n'
              printf '<meta charset="utf-8">\n'
              printf '<meta http-equiv="refresh" content="0; url=%s">\n' "$target"
              printf '<link rel="canonical" href="%s">\n' "$target"
              printf '<title>This page has moved</title>\n'
              printf '</head>\n<body>\n'
              printf '<p>This page has moved to <a href="%s">%s</a>.</p>\n' "$target" "$target"
              printf '</body>\n</html>\n'
            } > "$stub_path"
          }

          # The pkgdown pages: what was /pilotr/<path> is now /pilotr/r/<path>.
          find site/r -name '*.html' | while read -r page; do
            rel="${page#site/r/}"
            case "$rel" in
              # The root of the site now belongs to the landing page, and the three
              # staged trees own their own prefixes, so a stub written at any of
              # these paths would overwrite a page that is live in the new layout.
              index.html|r/*|python/*|app/*|py/*) continue ;;
              # A stub here would take every mistyped URL anywhere on the site,
              # including under /python/ and /app/, to the R site's not-found page.
              # The root 404.html is now the hub's own not-found page, staged from
              # .github/404.html by the landing-page step above, so this skip also
              # protects that file from being overwritten.
              404.html) continue ;;
            esac
            write_stub "site/$rel" "$SITE/r/$rel"
          done

          # The mkdocs pages: what was /pilotr/py/<path> is now /pilotr/python/<path>.
          # mkdocs publishes directory URLs, so the target drops a trailing
          # index.html and reads as the canonical the real page declares for
          # itself, rather than as a second spelling of it. Nothing can be
          # overwritten here, because site/py holds nothing but these stubs.
          find site/python -name '*.html' | while read -r page; do
            rel="${page#site/python/}"
            write_stub "site/py/$rel" "$SITE/python/${rel%index.html}"
          done

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          touch site/.nojekyll
          PUB="$(mktemp -d)"
          cp -r site/. "$PUB"/
          cd "$PUB"
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="pilotr-site[bot]" -c user.email="deploy@users.noreply.github.com" \
              commit -q -m "Deploy site (landing page, pkgdown, mkdocs and app)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
