# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# The R package lives in the r/pilotr subdirectory of this monorepo, so every
# r-lib step runs with working-directory: r/pilotr.
on:
  push:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/pilotr
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/pilotr
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The version floors in Suggests are a promise to anyone resolving against an older stack, and
  # nothing tested them: every cell above uses use-public-rspm, which resolves to the latest
  # release. The twin of the Python minimum-versions job in python-tests.yml. A failure here means
  # a floor needs raising to what actually works, not that the job is too strict.
  minimum-versions:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Everything without a declared floor, resolved normally, so that the step below is the only
      # thing pinning a version and a failure points at the floor rather than at the resolution.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/pilotr
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::remotes
            any::lme4
            any::lmerTest

      - name: Install the declared Suggests floors over whatever resolved above
        run: |
          remotes::install_version("ggplot2", version = "3.4.0", upgrade = "never")
          remotes::install_version("testthat", version = "3.0.0", upgrade = "never")
          for (p in c("ggplot2", "testthat"))
            cat(p, "at", as.character(utils::packageVersion(p)), "\n")
        shell: Rscript {0}

      # Vignettes are skipped so that knitr and rmarkdown, which carry no declared floor, cannot
      # decide the outcome of a job about floors.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/pilotr
          upload-snapshots: false
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
