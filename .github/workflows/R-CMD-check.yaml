# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# The R package lives in the r/pilotr subdirectory of this monorepo, so every
# r-lib step runs with working-directory: r/pilotr.
on:
  push:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The version floors in Suggests are a promise to anyone resolving against an older stack, and
  # nothing tested them: every cell above uses use-public-rspm, which resolves to the latest
  # release. The twin of the Python minimum-versions job in python-tests.yml. A failure here means
  # a floor needs raising to what actually works, not that the job is too strict.
  #
  # The job runs on oldrel-3, as depictr's does, because neither floor can be built on the current
  # R. R 4.6.0 hid SET_BODY, SET_CLOENV and SET_FORMALS, so no testthat before 3.3.0 compiles there,
  # and ggplot2 3.4.0 fails to lazy-load there. On release, both floors failed to install,
  # install_version() only warned, and the check went on to pass on the current releases.
  minimum-versions:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: 'oldrel-3'
          use-public-rspm: true

      # Everything without a declared floor, resolved normally, so that the step below is the only
      # thing pinning a version and a failure points at the floor rather than at the resolution.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::lme4
            any::lmerTest

      # The floors are read from DESCRIPTION, so this job tests whatever the file declares. pak stops
      # on a failed build, where install_version() warned and carried on, and each installed version
      # is then compared with its floor, so that a floor quietly left uninstalled fails the job.
      - name: Install the declared Suggests floors over whatever resolved above
        run: |
          suggests <- read.dcf("r/pilotr/DESCRIPTION", fields = "Suggests")[1, 1]
          entries <- trimws(strsplit(suggests, ",")[[1]])
          parts <- regmatches(entries, regexec("^([A-Za-z0-9.]+)\\s*\\(>=\\s*([0-9.-]+)\\)$", entries))
          parts <- parts[lengths(parts) == 3]
          floors <- setNames(vapply(parts, `[`, "", 3), vapply(parts, `[`, "", 2))
          if (!length(floors)) stop("DESCRIPTION declares no Suggests floor to test.", call. = FALSE)
          pak::pkg_install(paste0(names(floors), "@", floors), ask = FALSE)
          for (p in names(floors)) {
            got <- as.character(utils::packageVersion(p))
            cat(p, "at", got, "\n")
            if (!identical(got, floors[[p]])) {
              stop(p, " is at ", got, ", not at its declared floor ", floors[[p]], ".",
                   call. = FALSE)
            }
          }
        shell: Rscript {0}

      # Vignettes are skipped so that knitr and rmarkdown, which carry no declared floor, cannot
      # decide the outcome of a job about floors.
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          upload-snapshots: false
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'

  # roxygen2 generates NAMESPACE from the @export tags, and a stale one drops exports without
  # anything noticing: testthat runs inside the package namespace, where an unexported function is
  # still reachable, so the suite cannot tell a dropped export from a kept one. Regenerating and
  # diffing is the only check that can. It sits outside the matrix above because one platform
  # answers the question, and a matrix cell going red would read as a platform problem rather than
  # as a file that needs regenerating.
  #
  # NAMESPACE only, deliberately. Rd formatting shifts between roxygen2 releases, so gating man/
  # would redden this job for reasons unconnected to the change under test. site.yml regenerates Rd
  # for the docs build with roclets = "rd" and leaves NAMESPACE to this job.
  namespace:
    name: Committed NAMESPACE is current
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      # The package's dependencies are needed because roxygen loads it to read the tags. roxygen2
      # itself is pinned so that one of its releases cannot turn this job red with no source change;
      # raise this pin and the version DESCRIPTION records in the same commit.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/pilotr
          extra-packages: cran::roxygen2@8.0.0

      # Two roxygen2 versions can disagree about NAMESPACE, and the diff below would then be a
      # version difference wearing the clothes of stale source. Say which of the two it is.
      - name: Confirm the installed roxygen2 is the one DESCRIPTION was written with
        shell: Rscript {0}
        run: |
          installed <- as.character(utils::packageVersion("roxygen2"))
          desc <- read.dcf("r/pilotr/DESCRIPTION")
          # roxygen2 8 records itself in Config/roxygen2/version, earlier releases in RoxygenNote.
          # Consult them in the order roxygen2 itself does.
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(desc))[1]
          cat("roxygen2 installed:", installed, "\n")
          if (is.na(field)) {
            cat("r/pilotr/DESCRIPTION records no roxygen2 version, so there is nothing to compare.\n")
          } else {
            # read.dcf yields a named vector, and a stray name would fail identical().
            recorded <- trimws(unname(desc[1, field]))
            cat("r/pilotr/DESCRIPTION records", field, "=", recorded, "\n")
            if (!identical(installed, recorded)) {
              stop("Installed roxygen2 ", installed, " is not the ", recorded, " that ",
                   "r/pilotr/DESCRIPTION was written with, so a NAMESPACE difference here would ",
                   "say nothing about whether the file and the tags agree. Bring the pin in ",
                   ".github/workflows/R-CMD-check.yaml and the version in DESCRIPTION back into ",
                   "line.", call. = FALSE)
            }
          }

      # Handed a NAMESPACE without that header, roxygenise() leaves the file alone and still exits
      # 0, which would leave this job green over an arbitrarily stale file. That is how the exports
      # went missing here in the first place, so the header is checked rather than assumed.
      - name: Confirm NAMESPACE carries the roxygen2 header
        shell: Rscript {0}
        run: |
          first <- readLines("r/pilotr/NAMESPACE", n = 1, warn = FALSE)
          if (length(first) == 0 || !grepl("^# Generated by roxygen2", first)) {
            stop("r/pilotr/NAMESPACE does not begin with the roxygen2 header, so roxygenise() will ",
                 "skip it and this job would pass over a file it never regenerated. Delete ",
                 "r/pilotr/NAMESPACE, run devtools::document(\"r/pilotr\"), and check the exports in ",
                 "the regenerated file against the ones the deleted file declared.", call. = FALSE)
          }
          cat("Header present:", first, "\n")

      - name: Regenerate NAMESPACE from the roxygen comments
        shell: Rscript {0}
        run: roxygen2::roxygenise("r/pilotr", roclets = "namespace")

      - name: Fail if the committed NAMESPACE no longer matches the tags
        run: |
          if git diff --exit-code -- r/pilotr/NAMESPACE; then
            echo 'r/pilotr/NAMESPACE is current.'
          else
            echo '::error file=r/pilotr/NAMESPACE::Stale NAMESPACE. Run devtools::document("r/pilotr") and commit r/pilotr/NAMESPACE.'
            echo ''
            echo 'r/pilotr/NAMESPACE disagrees with the @export tags in r/pilotr/R/.'
            echo 'In the diff above, - lines stand in the committed file with no tag producing them,'
            echo 'and + lines are produced by the tags but missing from the committed file.'
            echo 'Run devtools::document("r/pilotr"), as .github/CONTRIBUTING.md sets out, then commit'
            echo 'the regenerated r/pilotr/NAMESPACE.'
            exit 1
          fi
