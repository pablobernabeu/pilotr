# Reports test coverage for the R package on each push and pull request, writing
# the percentage to the run summary. It uses no external service (no Codecov), so
# it needs no token and adds no badge that could rot. The package lives in the
# r/pilotr subdirectory of this monorepo, so the dependency step and the covr
# call both point there.
on:
  push:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'r/pilotr/**'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

name: test-coverage.yaml

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          working-directory: r/pilotr
          extra-packages: any::covr
          needs: check

      - name: Drop the two dev-only app gates from tests/
        # tests/test_app_logic.R and tests/test_app_server.R locate themselves
        # through the --file= argument Rscript passes them, which covr's test
        # runner does not supply, so under covr they stop at normalizePath()
        # before testing anything. Both are .Rbuildignore'd, so R CMD check
        # never runs them either; removing them from the runner's checkout
        # measures exactly the suite the built package carries.
        run: rm r/pilotr/tests/test_app_logic.R r/pilotr/tests/test_app_server.R

      - name: Measure and report coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(path = "r/pilotr", quiet = FALSE)
          pct <- round(covr::percent_coverage(cov), 1)
          cat(sprintf("Test coverage: %s%%\n", pct))
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) {
            cat(sprintf("## Test coverage: **%s%%**\n", pct),
                file = summary, append = TRUE)
          }
          if (pct < 80) {
            cat("::warning::Test coverage is below 80%\n")
          }
