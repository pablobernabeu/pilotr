url: https://pablobernabeu.github.io/pilotr/r

# The R package lives in a subdirectory of the monorepo (r/pilotr/), not at the
# repository root. Left to auto-detect, pkgdown's per-file "Source: <path>"
# links (reference pages, articles, NEWS) resolve one level too high and 404.
# Point the source template at the package's actual subdirectory; the repo and
# issue links stay at the root, which is correct for those.
repo:
  url:
    home: https://github.com/pablobernabeu/pilotr/
    source: https://github.com/pablobernabeu/pilotr/blob/main/r/pilotr/
    issue: https://github.com/pablobernabeu/pilotr/issues/
    user: https://github.com/

authors:
  Pablo Bernabeu:
    href: https://pablobernabeu.github.io

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#2C6FB0"
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

navbar:
  # House order: Get started, Reference, Articles, Changelog, About on the left;
  # search, light/dark switch, live demo and GitHub on the right.
  structure:
    left:  [intro, reference, articles, news, about]
    right: [app, search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    articles:
      text: Articles
      # Ordered by workflow: simulation topics first, then power and precision
      # analysis, then the reference-like cross-language topic, app last.
      menu:
      - text: Response families
        href: articles/response-families.html
      - text: Worked examples
        href: articles/worked-examples.html
      - text: Power and design analysis
        href: articles/power-analysis.html
      - text: Precision and ROPE design analysis
        href: articles/precision-rope.html
      - text: Cross-language reproducibility
        href: articles/cross-language.html
      - text: The no-code app
        href: articles/the-no-code-app.html
    about:
      text: About
      href: articles/about.html
    app:
      text: App
      href: https://pablobernabeu.github.io/pilotr/app/
      icon: fa-play
      aria-label: The no-code app
    github:
      icon: fa-github
      href: https://github.com/pablobernabeu/pilotr
      aria-label: GitHub

# Without this block the Articles index falls back to pkgdown's default heading
# and an alphabetical list, which buries the workflow order the navbar menu sets
# out and puts About among the guides. Get started and About each have their own
# navbar entry, so an internal group keeps them off the index, as on the twin
# sites.
articles:
- title: Guides
  contents:
  - response-families
  - worked-examples
  - power-analysis
  - precision-rope
  - cross-language
  - the-no-code-app
- title: internal
  contents:
  - getting-started
  - articles/about

# Grouped along the path a study takes: write a specification, simulate from it,
# analyse the design, then emit the code and the seeds that make the run
# reproducible. The Python twin's API reference uses the same group names in the
# same order, so a name is found in the same place on either site.
reference:
- title: Design specifications
  desc: Write, validate and load the portable JSON specification that everything else reads.
  contents:
  - build_spec
  - validate_spec
  - load_spec
  - spec_json
  - spec_from_model
  - pilotr_example
- title: Simulation
  desc: Draw a data set from a specification, together with the model that specification implies.
  contents:
  - simulate_design
  - model_data
  - model_formula
  - default_response_name
- title: Power and design analysis
  desc: Estimate power by simulation, at one sample size or across a range of them, and solve
    the resulting curve for the value that meets a target.
  contents:
  - power_design
  - power_mixed
  - power_curve_mixed
  - solve_curve
  - target_n
  - print.pilotr_power
- title: Precision and equivalence
  desc: Size a study for the width of an interval rather than for a significance test.
  contents:
  - precision_design
  - precision_curve
- title: Calibration and sweeps
  desc: Tune a specification towards a target, and vary one of its fields across a range.
  contents:
  - calibrate_response
  - response_variance
  - design_conditions
  - sweep_spec
- title: Generated analysis code
  desc: Emit runnable, self-contained code for the analysis a specification implies.
  contents:
  - generate_r_script
  - generate_design_analysis
  - brms_bridge
- title: Reproducibility
  desc: The shared random-number stream that makes an R run and a Python run agree bit for bit.
  contents:
  - make_rng
  - replicate_seeds
  - as241
- title: App
  desc: The code-free interface to the same workflow.
  contents:
  - run_app
- title: Package overview
  desc: What the package does, and where to start.
  contents:
  - pilotr-package

home:
  sidebar:
    # Slim the right sidebar: the licence is one British-spelled link (the
    # default "MIT + file LICENSE" line also points at a stub the deploy prunes),
    # Community shows only the contributing guide, and the citation points at the
    # About page rather than pkgdown's authors.html#citation.
    structure: [links, license, community, citation, authors, dev]
    components:
      license:
        title: Licence
        text: >
          [MIT licence](LICENSE.html)
      community:
        title: Community
        text: >
          [Contributing guide](CONTRIBUTING.html)
      citation:
        title: Citation
        text: |
          [How to cite pilotr](articles/about.html)

          [![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.21266313.svg)](https://doi.org/10.5281/zenodo.21266313)

footer:
  structure:
    left: [developed_by]
    right: [legal, built_with]
  components:
    developed_by: >
      Developed by [Pablo Bernabeu](https://pablobernabeu.github.io). Open,
      reproducible research software in R and Python.
    # The licence path is root-relative, unlike the home sidebar's above. pkgdown
    # renders the footer into every page without adjusting a relative href for the
    # page's depth, so a bare LICENSE.html resolves against the current directory
    # and 404s everywhere below the top of the R site (articles/LICENSE.html and
    # the like). An absolute URL does not help: pkgdown strips the configured site
    # url back off and leaves the same bare filename. A leading slash is the one
    # form that survives, and it is unambiguous from any depth. It has to spell out
    # both the project prefix GitHub Pages serves this repository under and the /r
    # segment the R site now occupies within the hub. The sidebar keeps its relative
    # href because it renders only on the home page, at the top of the R site.
    legal: >
      Released under the [MIT licence](/pilotr/r/LICENSE.html).
